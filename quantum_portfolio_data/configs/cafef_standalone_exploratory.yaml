mode: exploratory
label: "EXPLORATORY ONLY - STANDALONE CAFEF HOSE PANEL; NOT CONFIRMATORY RESEARCH"
seed: 42
data:
  source: cafef_public_history_standalone
  start: "2020-01-01"
  end: "2025-12-31"
  rebalance: monthly
universe:
  definition: hose_all_listed
  index_code: null
  max_assets: 12
  liquidity_lookback_days: 60
  minimum_observations: 40
walk_forward:
  train_months: 24
  validation_months: 3
  test_months: 1
  max_folds: 12
  embargo_days: 20
  selection: evenly_spaced
target:
  horizon_days: 20
model:
  kind: xgboost
  n_estimators: 180
  max_depth: 4
  learning_rate: 0.035
  min_feature_coverage: 0.05
reduction:
  qubit_budget: 8
  candidate_size: 8
  min_candidate_size: 6
  max_candidate_size: 8
  cardinality: 4
  signal_weight: 0.55
  liquidity_weight: 0.20
  risk_weight: 0.15
  correlation_penalty: 0.10
  low_signal_dispersion_ratio: 0.10
  high_correlation_threshold: 0.65
qubo:
  risk_aversion: 0.55
  expected_return_source: xgboost_calibrated
covariance:
  method: ewma
  span: 60
  horizon_days: 20
  minimum_coverage: 0.95
solver:
  qaoa_depth: 2
  shots: 2048
  seeds: [11, 23, 47, 59, 71]
  parameter_trials: 60
  optimizer: COBYLA
weights:
  lower: 0.0
  upper: 0.40
  risk_aversion: 1.0
  turnover_penalty: 0.001
constraints:
  portfolio_notional_vnd: 100000000
  max_adv_participation: 0.05
  max_one_way_turnover: null
  sector_cap: 0.50
backtest:
  transaction_cost_bps: 10
  commission_bps: 10
  sell_tax_bps: 10
  slippage_bps: 5
  impact_coefficient: 0.0005
  delisting_return: -1.0
  maximum_unexplained_gap_days: 5
  risk_free_annual: 0.03
benchmark:
  name: VNINDEX_TOTAL_RETURN
  required: false
risk_free:
  mode: fixed_annual
  annual_rate: 0.03
sensitivity:
  design: partial_factorial_representative_folds
  representative_folds: 3
  seeds: [11, 23]
exploratory:
  allowed_leakage_blockers:
    - price_adjustment_policy_verified
    - price_adjustment_contract_matches_dataset
